name: PrismaX Validation Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-prismax:
    runs-on: ubuntu-latest

    steps:
      - name: Check PrismaX uploads
        env:
          PRISMAX_TOKEN: ${{ secrets.PRISMAX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          PRISMAX_URL = "https://data.prismaxserver.com/data/qa/uploads"

          headers = {
              "Authorization": f"Bearer {os.environ['PRISMAX_TOKEN']}",
              "Origin": "https://app.prismax.ai",
              "Referer": "https://app.prismax.ai/",
              "Accept": "*/*",
          }

          TELEGRAM_URL = (
              f"https://api.telegram.org/bot"
              f"{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          )

          print("Token loaded:", bool(os.environ.get("PRISMAX_TOKEN")))

          response = requests.get(
          PRISMAX_URL,
           headers=headers,
           timeout=20
          )
          )

          print("PrismaX status:", response.status_code)
          print("PrismaX response:", response.text)

          response.raise_for_status()

          result = response.json()
          uploads = result.get("data", [])

          print(f"PrismaX uploads found: {len(uploads)}")

          if not uploads:
              print("No uploads currently available.")
              raise SystemExit

          message = (
              "🔔 NEW PRISMAX VALIDATION UPLOAD!\n\n"
              f"Uploads detected: {len(uploads)}\n\n"
              "👉 Open PrismaX Validation:\n"
              "https://app.prismax.ai/data/review"
          )

          telegram_response = requests.post(
              TELEGRAM_URL,
              data={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              },
              timeout=20
          )

          telegram_response.raise_for_status()

          print("Telegram notification sent.")
          PY
